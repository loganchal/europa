name: Temporary split Batyrev Ewald retry
on:
  push:
    branches: [chatgpt-ewald-batyrev-retry2-20260815]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        range: ['830-849','849-868','868-887','887-906','1132-1151','1151-1170','1170-1189','1189-1208','1434-1453','1453-1472','1472-1491','1491-1510']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Scan range
        shell: bash
        run: |
          r='${{ matrix.range }}'; A=${r%%-*}; B=${r##*-}
          python scan_batyrev_ewald.py --start "$A" --end "$B" --out "retry2-${r}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry2-${{ matrix.range }}
          path: retry2-*.json
          retention-days: 2
          if-no-files-found: warn
