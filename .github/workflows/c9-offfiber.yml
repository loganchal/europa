name: Temporary exact c9 off-fiber birational search

on:
  push:
    branches:
      - chatgpt-ewald-c9-offfiber-20260814

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: r14, raycap: 14, seen: 100000}
          - {name: r16, raycap: 16, seen: 100000}
          - {name: r18, raycap: 18, seen: 100000}
          - {name: r20, raycap: 20, seen: 100000}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Search exact smooth-Fano birational states
        run: python c9_offfiber_bir.py --raycap ${{ matrix.raycap }} --seconds 1800 --seen-cap ${{ matrix.seen }} --out c9-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c9-${{ matrix.name }}
          path: c9-${{ matrix.name }}.json
          retention-days: 3
          if-no-files-found: warn
