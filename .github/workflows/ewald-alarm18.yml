name: Temporary inspect Ewald alarm18
on:
  push:
    branches: [chatgpt-ewald-alarm18-20260815]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print alarm candidate
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/9239810232/zip > /tmp/a.zip
          unzip -p /tmp/a.zip '*.json' | tee /tmp/a.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a.json'))
          print('ALARMS',json.dumps(d.get('alarms',[]),separators=(',',':')))
          print('RANKBAD',json.dumps(d.get('rankbad',[]),separators=(',',':')))
          print('ERRORS',json.dumps(d.get('error_records',d.get('errors_detail',[])),separators=(',',':')))
          PY
