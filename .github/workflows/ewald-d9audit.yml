name: Temporary exact d9 neatness audit
on:
  push:
    branches: [chatgpt-ewald-d9audit-20260815]
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Aggregate facet16 and facet17 exact shards
        run: |
          set -euo pipefail
          mkdir -p /tmp/a
          : > all.ndjson
          for run in 31788058450 31855913597; do
            gh api --paginate "repos/${{ github.repository }}/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | [.id,.name] | @tsv' > /tmp/list.tsv
            while IFS=$'\t' read -r id name; do
              case "$name" in exact16-*|exact17-*) ;;& *) continue;; esac
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/a/$id.zip"
              unzip -pq "/tmp/a/$id.zip" '*.json' >> all.ndjson || true
              printf '\n' >> all.ndjson
            done < /tmp/list.tsv
          done
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('all.ndjson') if x.strip()]
          # Keep only completed coverage: original mod16 success residues and split mod32 heavy residues; facet17 all.
          ok16_old={2,3,4,6,10,11,12,15}
          heavy32={0,1,5,7,8,9,13,14,16,17,21,23,24,25,29,30}
          use=[]
          for r in rows:
              f=r.get('facets')
              if f==17: use.append(r)
              elif f==16:
                  sh=r.get('shard'); ns=r.get('shards')
                  if ns==16 and sh in ok16_old: use.append(r)
                  elif ns==32 and sh in heavy32: use.append(r)
          by={16:[],17:[]}
          for r in use:by[r['facets']].append(r)
          out={}
          for f,rs in by.items():
              out[f]={
                'rows':len(rs),'selected':sum(r.get('selected',0) for r in rs),
                'nonneat':sum(len(r.get('nonneat',[])) for r in rs),
                'unresolved':sum(len(r.get('unresolved',[])) for r in rs),
                'errors':sum(len(r.get('errors',[])) for r in rs),
                'min_inter':min((r.get('best_inter',[10**9])[0] for r in rs),default=None),
                'shards':sorted((r.get('shards'),r.get('shard')) for r in rs),
              }
          print('AUDIT',json.dumps(out,separators=(',',':')))
          assert out[16]['selected']==2822309, out
          assert out[17]['selected']==1829247, out
          assert all(out[f][k]==0 for f in (16,17) for k in ('nonneat','unresolved','errors')), out
          PY
