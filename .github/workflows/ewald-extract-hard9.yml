name: Temporary extract extremal dimension-9 Ewald seeds

on:
  push:
    branches:
      - automation/ewald-search9-20260903
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  extract:
    name: Extract ${{ matrix.facets }}-facet seeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        facets: [13, 14, 15, 16, 17, 18, 19]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Download public classification shard
        run: |
          curl -L --fail --retry 5 -sS \
            "https://polymake.org/polytopes/paffenholz/data/smooth-fano/d9/fv-09-${{ matrix.facets }}p.gz" \
            -o "fv-09-${{ matrix.facets }}p.gz"
          gzip -t "fv-09-${{ matrix.facets }}p.gz"
      - name: Extract exact extremal records
        run: |
          python ewald_search9/extract_hard9.py \
            "fv-09-${{ matrix.facets }}p.gz" \
            --facets "${{ matrix.facets }}" --top 100 \
            --out "hard9-${{ matrix.facets }}.json"
      - name: Upload seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard9-${{ matrix.facets }}
          path: hard9-${{ matrix.facets }}.json
          if-no-files-found: warn
          retention-days: 1
