name: Temporary hard d9 twist Ewald scan
on:
  push:
    branches: [chatgpt-ewald-hardtwists-20260815]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        base: ['12-6','12-424','12-426','13-4124','13-4127','13-6574']
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exhaust twists
        shell: bash
        run: |
          f=${{ matrix.base }}; facets=${f%%-*}; idx=${f##*-}
          python scan_hard_twists10.py --facets "$facets" --index "$idx" --R 12 --shard ${{ matrix.shard }} --shards 4 --out "hard-${f}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-${{ matrix.base }}-${{ matrix.shard }}
          path: hard-*.json
          retention-days: 2
          if-no-files-found: warn
