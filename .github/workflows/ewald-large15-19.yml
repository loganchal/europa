name: Temporary exact d9 large-box facets 15-19

on:
  push:
    branches:
      - chatgpt-ewald-large15-19-20260814

permissions:
  contents: read

jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        facets: [15,16,17,18,19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact large-box neatness check
        run: python neat_large9.py --facets ${{ matrix.facets }} --out large9-${{ matrix.facets }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large9-${{ matrix.facets }}
          path: large9-${{ matrix.facets }}.json
          retention-days: 3
          if-no-files-found: warn
