name: Ewald dimension-9 neatness prefilter pilot

on:
  push:
    branches:
      - ewald-search-20260902
    paths:
      - .github/workflows/ewald-neat-prefilter.yml
      - tools/polydb_binary_stream.py
      - tools/ewald_neat_prefilter.cpp

permissions:
  contents: read

jobs:
  neat-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out search code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MongoDB client
        run: python -m pip install --disable-pip-version-check pymongo

      - name: Compile exact neatness prefilter
        run: g++ -O3 -std=c++20 -Wall -Wextra -pedantic tools/ewald_neat_prefilter.cpp -o ewald_neat_prefilter

      - name: Scan displacement boxes in pilot range
        run: |
          set -o pipefail
          python tools/polydb_binary_stream.py \
            --shard neat-pilot \
            --ranges 13:0:63971,14:0:50000 \
            --progress-every 25000 \
          | ./ewald_neat_prefilter \
            --shard neat-pilot \
            --ranges 13:0:63971,14:0:50000 \
            --output neat-pilot.json \
            --exact-box-limit 100000 \
            --heuristic-trials 500 \
            --retain 200

      - name: Upload exact prefilter result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-neatness-pilot
          path: neat-pilot.json
          if-no-files-found: warn
          retention-days: 7
