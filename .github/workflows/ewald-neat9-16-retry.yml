name: Temporary exact d9 facet16 retry

on:
  push:
    branches:
      - chatgpt-ewald-neat9-16-retry-20260815

permissions:
  contents: read
  actions: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1,5,7,8,9,13,14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact facet16 neatness retry
        run: python neat_exact9.py --facets 16 --shard ${{ matrix.shard }} --shards 16 --maxbox 200000 --out exact-16-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-exact-16-${{ matrix.shard }}
          path: exact-16-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
