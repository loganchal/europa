name: Temporary exact d9 neatness benchmark

on:
  push:
    branches:
      - chatgpt-ewald-neat9-shards-20260813

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - facets: 14
            shard: 0
            shards: 100
          - facets: 15
            shard: 0
            shards: 150
          - facets: 16
            shard: 0
            shards: 200
          - facets: 17
            shard: 0
            shards: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact neatness shard
        run: python neat_exact9.py --facets ${{ matrix.facets }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --out bench-${{ matrix.facets }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.facets }}
          path: bench-${{ matrix.facets }}.json
          retention-days: 1
          if-no-files-found: warn
