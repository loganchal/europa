name: Temporary certified d9 neatness scan

on:
  push:
    branches:
      - chatgpt-ewald-neat9-full-20260813

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          shards={10:1,11:1,12:1,13:1,14:18,15:61,16:84,17:55,18:20,19:5,20:1,21:1,22:1,23:1,24:1,25:1,26:1}
          include=[{'facets':f,'shard':s,'shards':n} for f,n in shards.items() for s in range(n)]
          print('value='+json.dumps({'include':include},separators=(',',':')))
          PY

  exact:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Certified exact neatness shard
        run: python neat_exact9_cert.py --facets ${{ matrix.facets }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --out result-${{ matrix.facets }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.facets }}-${{ matrix.shard }}
          path: result-${{ matrix.facets }}-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
