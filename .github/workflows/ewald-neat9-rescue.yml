name: Temporary exact d9 neatness rescue
on:
  push:
    branches: [chatgpt-ewald-neat9-rescue-20260814]
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [0,1,5,7,8,9,13,14,16,17,21,23,24,25,29,30,32,33,37,39,40,41,45,46,48,49,53,55,56,57,61,62]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact rescued neatness check
        run: python neat_exact9.py --facets 16 --shard ${{ matrix.shard }} --shards 64 --maxbox 200000 --out rescue-16-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-16-${{ matrix.shard }}
          path: rescue-16-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
