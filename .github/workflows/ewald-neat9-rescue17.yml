name: Temporary exact d9 neatness rescue17
on:
  push:
    branches: [chatgpt-ewald-neat9-rescue17-20260814]
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [10,11,12,13,14,15,26,27,28,29,30,31,42,43,44,45,46,47,58,59,60,61,62,63]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact rescued neatness check
        run: python neat_exact9.py --facets 17 --shard ${{ matrix.shard }} --shards 64 --maxbox 200000 --out rescue-17-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-17-${{ matrix.shard }}
          path: rescue-17-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
