name: Temporary Ewald dimension-8 scan

on:
  push:
    branches:
      - chatgpt-ewald-scan-20260811

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Scan classification shard
        run: python ewald_scan.py --shard ${{ matrix.shard }} --shards 8 --out result-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: ewald-result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.json
          retention-days: 1
