name: Ewald dimension-9 database statistics

on:
  push:
    branches:
      - ewald-search-20260902
    paths:
      - .github/workflows/ewald-scan.yml
      - tools/polydb_dim9_stats.py

permissions:
  contents: read

jobs:
  dim9-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out search code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MongoDB client
        run: python -m pip install --disable-pip-version-check pymongo

      - name: Inspect dimension-9 shards and throughput
        run: python tools/polydb_dim9_stats.py dim9-stats.json

      - name: Upload statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polydb-dimension9-stats
          path: dim9-stats.json
          if-no-files-found: warn
          retention-days: 7
