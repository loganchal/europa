name: Ewald dimension-9 scan pilot

on:
  push:
    branches:
      - ewald-search-20260902
    paths:
      - .github/workflows/ewald-scan.yml
      - tools/polydb_ewald_scan.py

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out search code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymongo numpy

      - name: Scan 113971 classified dimension-9 polytopes
        run: |
          python tools/polydb_ewald_scan.py \
            --shard pilot \
            --ranges 13:0:63971,14:0:50000 \
            --top-k 250 \
            --basis-trials 10000 \
            --output dim9-pilot.json

      - name: Upload exact pilot result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-dimension9-pilot
          path: dim9-pilot.json
          if-no-files-found: warn
          retention-days: 7
