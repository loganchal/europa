    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact neatness scan of dimension-9 shard
        run: python neat_exact9.py --facets ${{ matrix.facets }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --out neat9-${{ matrix.facets }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neat9-${{ matrix.facets }}-${{ matrix.shard }}
          path: neat9-${{ matrix.facets }}-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
