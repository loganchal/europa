name: Temporary Ewald dimension-9 href probe

on:
  push:
    branches:
      - chatgpt-ewald-scan-20260811

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract dimension-9 data links
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://polymake.org/polytopes/paffenholz/www/fano.html' -o fano.html
          grep -oE 'href="[^"]*fv-09-[0-9]+p\.gz"' fano.html | head -30
