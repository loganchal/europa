name: Ewald dimension-9 C++ pilot

on:
  push:
    branches:
      - ewald-search-20260902
    paths:
      - .github/workflows/ewald-scan.yml
      - tools/polydb_binary_stream.py
      - tools/ewald_dim9_backend.cpp

permissions:
  contents: read

jobs:
  cpp-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out search code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MongoDB client
        run: python -m pip install --disable-pip-version-check pymongo

      - name: Compile exact scanner backend
        run: g++ -O3 -std=c++20 -Wall -Wextra -pedantic tools/ewald_dim9_backend.cpp -o ewald_dim9_backend

      - name: Stream and scan 113971 dimension-9 polytopes
        run: |
          set -o pipefail
          python tools/polydb_binary_stream.py \
            --shard cpp-pilot \
            --ranges 13:0:63971,14:0:50000 \
            --progress-every 25000 \
          | ./ewald_dim9_backend \
            --shard cpp-pilot \
            --ranges 13:0:63971,14:0:50000 \
            --output dim9-cpp-pilot.json \
            --top-k 100 \
            --max-trials 5000

      - name: Upload exact C++ pilot result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-dimension9-cpp-pilot
          path: dim9-cpp-pilot.json
          if-no-files-found: warn
          retention-days: 7
