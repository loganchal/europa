name: Temporary Ewald dimension-9 data probe

on:
  push:
    branches:
      - chatgpt-ewald-scan-20260811

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        facets: [10, 18, 26]
    steps:
      - name: Inspect classification file
        shell: bash
        run: |
          set -euo pipefail
          url="https://polymake.org/polytopes/paffenholz/data/smooth-fano/d9/fv-09-${{ matrix.facets }}p.gz"
          curl -fL --retry 3 "$url" -o data.gz
          echo "URL=$url"
          echo "BYTES=$(wc -c < data.gz)"
          gzip -dc data.gz | head -n 30 || true
