name: Ewald dimension-9 data probe

on:
  push:
    branches:
      - ewald-search-20260902
    paths:
      - .github/workflows/ewald-scan.yml
      - tools/polydb_probe.py

permissions:
  contents: read

jobs:
  polydb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out search code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MongoDB client
        run: python -m pip install --disable-pip-version-check pymongo certifi

      - name: Query public polyDB
        run: python tools/polydb_probe.py polydb-probe.json

      - name: Upload exact probe response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polydb-dimension9-probe
          path: polydb-probe.json
          if-no-files-found: warn
          retention-days: 7
