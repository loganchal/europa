name: Temporary Ewald dimension-8 search

on:
  push:
    branches:
      - automation/ewald-search-20260903
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    name: Scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Fetch the public smooth-Fano dimension-8 classification
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/GorrieXIV/Magma.git /tmp/magma-db
          git -C /tmp/magma-db sparse-checkout set libs/data/polytopes/smoothfano8
          test -f /tmp/magma-db/libs/data/polytopes/smoothfano8/block100

      - name: Exhaustively screen this shard
        run: |
          python ewald_search/full_scan.py \
            /tmp/magma-db/libs/data/polytopes/smoothfano8 \
            --shard ${{ matrix.shard }} --shards 8 \
            --out ewald-result-${{ matrix.shard }}.json

      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-result-${{ matrix.shard }}
          path: ewald-result-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1
