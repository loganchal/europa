name: Temporary exhaustive Ewald dimension-9 search

on:
  push:
    branches:
      - automation/ewald-search9-20260903
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    name: Scan ${{ matrix.facets }} facets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        facets: [26, 25, 24, 23, 22, 21, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10]

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact-mask numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Download public classification shard
        run: |
          curl -L --fail --retry 5 -sS \
            "https://polymake.org/polytopes/paffenholz/data/smooth-fano/d9/fv-09-${{ matrix.facets }}p.gz" \
            -o "fv-09-${{ matrix.facets }}p.gz"
          gzip -t "fv-09-${{ matrix.facets }}p.gz"
          sha256sum "fv-09-${{ matrix.facets }}p.gz"

      - name: Exhaustively screen the shard
        run: |
          python ewald_search9/full_scan9.py \
            "fv-09-${{ matrix.facets }}p.gz" \
            --facets "${{ matrix.facets }}" \
            --out "ewald9-result-${{ matrix.facets }}.json"

      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald9-result-${{ matrix.facets }}
          path: ewald9-result-${{ matrix.facets }}.json
          if-no-files-found: warn
          retention-days: 1
