name: Temporary targeted d9 exact neatness

on:
  push:
    branches:
      - chatgpt-ewald-target-20260811

permissions:
  contents: read

jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        facets: [20,21,22,23,24,25,26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Exact large-box neatness check
        run: python neat_large9.py --facets ${{ matrix.facets }} --out large9-${{ matrix.facets }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large9-${{ matrix.facets }}
          path: large9-${{ matrix.facets }}.json
          retention-days: 1
          if-no-files-found: warn
