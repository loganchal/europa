name: Temporary strict dimension-10 F-equivalence search

on:
  push:
    branches:
      - chatgpt-ewald-fcomp-20260811

permissions:
  contents: read

jobs:
  fcomp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        raycap: [16,17,18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Traverse strict F-equivalence component
        run: python fcomp10.py --raycap ${{ matrix.raycap }} --seconds 2400 --out fcomp-${{ matrix.raycap }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcomp-${{ matrix.raycap }}
          path: fcomp-${{ matrix.raycap }}.json
          retention-days: 1
          if-no-files-found: warn
