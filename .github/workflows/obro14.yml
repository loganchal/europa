name: Temporary dimension-10 rank-4 Obro scan
on:
  push:
    branches: [chatgpt-ewald-probe-20260811]
permissions:
  contents: read
jobs:
  rank4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch and patch Obro generator
        run: |
          set -euo pipefail
          curl -fL https://raw.githubusercontent.com/rohansjoshi/Obro-SFP/main/smooth_Fanos.cpp -o smooth_Fanos.cpp
          python - <<'PY'
          p='smooth_Fanos.cpp'
          s=open(p).read()
          needle='    remove_facets(number_of_facets);\n    // Determine which hyperplanes to place the next vertex in.'
          repl='    remove_facets(number_of_facets);\n    // Fixed Picard-rank-4 search: stop after testing 14 rays.\n    if (vertices.size() >= 14) return;\n    // Determine which hyperplanes to place the next vertex in.'
          assert needle in s
          s=s.replace(needle,repl,1)
          a=s.index('    // Read arguments.')
          b=s.index('    // Open output files',a)
          fixed='    // Fixed dimension 10; use X only as a filename character.\n    d = 10;\n    int d_char = 88;\n'
          s=s[:a]+fixed+s[b:]
          open(p,'w').write(s)
          PY
          g++ -O3 -std=c++17 smooth_Fanos.cpp -o obro14
      - name: Enumerate dimension-10 classes through 14 rays
        run: |
          set -euo pipefail
          /usr/bin/time -v ./obro14
          cat msgdX
          awk 'NF==0{if(n){print n;n=0};next}{n++}END{if(n)print n}' fanovertdX | sort -n | uniq -c > raycounts.txt
          echo 'OUTPUT_BLOCK_COUNTS'; cat raycounts.txt
          cp msgdX obro14-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obro10-max14
          path: |
            obro14-summary.txt
            raycounts.txt
            fanovertdX
          retention-days: 1
          if-no-files-found: warn
