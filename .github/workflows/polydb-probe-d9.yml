name: PolyDB dimension-9 direct probe

on:
  pull_request:
    paths:
      - '.github/polydb_probe_d9.py'
      - '.github/workflows/polydb-probe-d9.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymongo
      - run: python .github/polydb_probe_d9.py
