name: Temporary targeted d6 star-Ewald seed recovery
on:
  push:
    branches: [chatgpt-ewald-star6-polydb-20260815]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy requests
      - run: python scan_star6_polydb.py --start 70 --end 71 --out star6-0070.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: star6-0070
          path: star6-0070.json
          retention-days: 1
          if-no-files-found: warn
