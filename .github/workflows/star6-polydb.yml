name: Temporary complete corrected d6 star-Ewald scan
on:
  push:
    branches: [chatgpt-ewald-star6-polydb-20260815]
permissions:
  contents: read
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 0, end: 480}
          - {shard: 1, start: 480, end: 960}
          - {shard: 2, start: 960, end: 1440}
          - {shard: 3, start: 1440, end: 1920}
          - {shard: 4, start: 1920, end: 2400}
          - {shard: 5, start: 2400, end: 2880}
          - {shard: 6, start: 2880, end: 3360}
          - {shard: 7, start: 3360, end: 3840}
          - {shard: 8, start: 3840, end: 4320}
          - {shard: 9, start: 4320, end: 4800}
          - {shard: 10, start: 4800, end: 5280}
          - {shard: 11, start: 5280, end: 5760}
          - {shard: 12, start: 5760, end: 6240}
          - {shard: 13, start: 6240, end: 6720}
          - {shard: 14, start: 6720, end: 7200}
          - {shard: 15, start: 7200, end: 7622}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy requests
      - run: python scan_star6_polydb.py --start ${{ matrix.start }} --end ${{ matrix.end }} --out star6-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: star6-${{ matrix.shard }}
          path: star6-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn
